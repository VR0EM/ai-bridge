[project]
name = "ai-bridge"
version = "0.1.0"
description = "Lokale MCP-bridge tussen Claude en Gemini (Antigravity)"
requires-python = ">=3.13"
dependencies = ["mcp[cli]>=2.3.0,<3"]

[project.scripts]
bridge = "ai_bridge.cli:main"
ai-bridge-server = "ai_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_bridge"]
